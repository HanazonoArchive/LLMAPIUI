<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLMAPIUI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <div class="app-container">
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <span class="logo-text">LLMAPIUI</span>
          </div>
        </div>

        <div class="settings-section">
          <div class="section-title"><i class="fa-solid fa-network-wired"></i> Connection</div>
          <div class="form-group">
            <label>Base URL</label>
            <input
              type="text"
              id="input-url"
              placeholder="http://localhost:0000/v1"
            />
          </div>
          <div class="form-group">
            <label>API Key</label>
            <input type="password" id="input-key" placeholder="your-api-key" />
          </div>
          <div class="form-group">
            <label>Cooldown (seconds)</label>
            <input
              type="number"
              id="input-cooldown"
              value="99"
              min="1"
              max="99"
            />
          </div>
          <div class="form-group">
            <label>System Guardrails</label>
            <textarea
              id="input-guardrails"
              rows="2"
              placeholder="Be helpful, accurate, and conversational. No disclaimers about being an AI. Use natural language. Your Name is Rei remember that. Keep it short, concise, put it under 70 words."
            ></textarea>
          </div>
          <div class="form-group">
            <label>Max Retries</label>
            <input type="number" id="input-retries" value="3" min="1" max="5" />
          </div>
          <div class="form-group">
            <label>Max Tokens per Request</label>
            <input
              type="number"
              id="input-max-tokens"
              value="2000"
              min="100"
              max="8000"
              step="100"
            />
          </div>
          <button class="btn-primary" onclick="saveSettings()">
            <i class="fa-solid fa-plug"></i> Save & Connect
          </button>
        </div>

        <div class="pool-header">
          <span class="pool-title"><i class="fa-solid fa-server"></i> Model Pool</span>
          <span class="pool-count" id="pool-count">0/0</span>
        </div>
        <div class="model-list" id="model-list">
          <div class="empty-state">Loading models...</div>
        </div>
      </div>

      <div class="main-content">
        <div class="chat-container" id="chat-container">
          <div class="welcome-message">
            <div class="welcome-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <div class="welcome-title">LLMAPIUI</div>
            <div class="welcome-desc">Welcome to LLMAPIUI!</div>
          </div>
        </div>

        <div class="input-area">
          <div class="input-wrapper">
            <input
              type="text"
              class="user-input"
              id="user-input"
              placeholder="Ask me anything... (press Enter to send)"
            />
            <button class="send-btn" onclick="sendMessage()">
              <i class="fa-solid fa-paper-plane"></i> Send
            </button>
          </div>
        </div>

        <div class="logs-area">
          <div class="logs-header">
            <span><i class="fa-solid fa-terminal"></i> System Logs</span>
            <span class="clear-logs" onclick="clearLogs()"><i class="fa-solid fa-trash-can"></i> Clear</span>
          </div>
          <div class="logs-container" id="logs">
            <div class="log-entry">
              <i class="fa-solid fa-circle-info log-icon-info"></i> LLMAPIUI initialized. Configure your endpoint to begin.
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

    <script>
      if (typeof window.log === "undefined") {
        window.log = function (message, type = "info") {
          const logsContainer = document.getElementById("logs");
          if (!logsContainer) return;

          const entry = document.createElement("div");
          entry.className = "log-entry";
          const time = new Date().toLocaleTimeString();

          let iconClass = 'fa-solid fa-circle-info';
          switch (type) {
            case 'error': iconClass = 'fa-solid fa-circle-xmark'; break;
            case 'success': iconClass = 'fa-solid fa-circle-check'; break;
            case 'warning': iconClass = 'fa-solid fa-triangle-exclamation'; break;
            case 'yellow': iconClass = 'fa-solid fa-hourglass-half'; break;
          }

          const iconHtml = `<i class="${iconClass} log-icon-${type}"></i>`;
          entry.innerHTML = `<span style="color:#6e6e8a">[${time}]</span> ${iconHtml} ${message}`;
          logsContainer.appendChild(entry);
          logsContainer.scrollTop = logsContainer.scrollHeight;
          console.log(`[${type}] ${message}`);
        };
      }

      window.clearLogs =
        window.clearLogs ||
        function () {
          const logsContainer = document.getElementById("logs");
          if (logsContainer) {
            logsContainer.innerHTML =
              '<div class="log-entry"><i class="fa-solid fa-trash-can"></i> Logs cleared.</div>';
          }
        };

      if (typeof window.showTypingIndicator === "undefined") {
        let typingElement = null;

        window.showTypingIndicator = function () {
          const container = document.getElementById("chat-container");
          if (!container) return;
          if (window.hideTypingIndicator) window.hideTypingIndicator();

          typingElement = document.createElement("div");
          typingElement.className = "typing-indicator";
          typingElement.innerHTML =
            '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
          container.appendChild(typingElement);
          container.scrollTop = container.scrollHeight;
        };

        window.hideTypingIndicator = function () {
          if (typingElement && typingElement.remove) {
            typingElement.remove();
            typingElement = null;
          }
        };
      }

      if (typeof window.appendMessage === "undefined") {
        window.appendMessage = function (text, sender, modelLabel = null) {
          const container = document.getElementById("chat-container");
          if (!container) return;

          const welcome = container.querySelector(".welcome-message");
          if (welcome && (sender === "user" || sender === "assistant")) {
            welcome.remove();
          }

          const bubble = document.createElement("div");
          bubble.className = `message ${sender}`;
          bubble.innerText = text;

          if (modelLabel && sender === "assistant") {
            const meta = document.createElement("span");
            meta.className = "message-meta";
            meta.innerHTML = `<i class="fa-solid fa-bolt"></i> via ${modelLabel}`;
            bubble.appendChild(meta);
          }

          container.appendChild(bubble);
          container.scrollTop = container.scrollHeight;
        };
      }
    </script>
  </body>
</html>
